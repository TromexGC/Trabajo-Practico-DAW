<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Películas</title>

    <link rel="stylesheet" href="../CSS/reset.css">
    <link rel="stylesheet" href="../CSS/peliculas.css">
</head>

<body>

    <header class="movies-header">
        <h1>Gestión de Películas</h1>
        <button id="btnVolver">Volver al Home</button>
    </header>

    <main class="movies-main">

        <section class="user-info">
            <p id="usuarioLogueado"></p>
            <p id="rolUsuario"></p>
        </section>

        <section class="movies-card">
            <h2>Crear película</h2>

            <form id="formCrearPelicula" class="movies-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" required>
                </div>

                <div class="form-group">
                    <label for="genero">Género:</label>
                    <input type="text" id="genero">
                </div>

                <div class="form-group">
                    <label for="director">Director:</label>
                    <input type="text" id="director">
                </div>

                <div class="form-group">
                    <label for="anio">Año:</label>
                    <input type="number" id="anio">
                </div>
                <div class="form-group">
                    <label for="posterUrl">URL de portada:</label>
                    <input type="text" id="posterUrl" placeholder="https://...">
                </div>

                <button type="submit">Crear película</button>
            </form>
        </section>

        <section class="movies-card">
            <h2>Listado de películas</h2>
            <button id="btnListarPeliculas">Actualizar listado</button>

            <table class="movies-table">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Portada</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Género</th>
                        <th>Director</th>
                        <th>Año</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaPeliculas">
                </tbody>
            </table>
        </section>

        <section class="movies-card" id="seccionEditar" hidden>
            <h2>Editar película</h2>

            <form id="formEditarPelicula" class="movies-form">
                <div class="form-group">
                    <label for="editarId">Id:</label>
                    <input type="number" id="editarId" required readonly>
                </div>

                <div class="form-group">
                    <label for="editarNombre">Nombre:</label>
                    <input type="text" id="editarNombre" required>
                </div>

                <div class="form-group">
                    <label for="editarDescripcion">Descripción:</label>
                    <input type="text" id="editarDescripcion" required>
                </div>

                <div class="form-group">
                    <label for="editarGenero">Género:</label>
                    <input type="text" id="editarGenero">
                </div>

                <div class="form-group">
                    <label for="editarDirector">Director:</label>
                    <input type="text" id="editarDirector">
                </div>

                <div class="form-group">
                    <label for="editarAnio">Año:</label>
                    <input type="number" id="editarAnio">
                </div>
                <div class="form-group">
                    <label for="editarPosterUrl">URL de portada:</label>
                    <input type="text" id="editarPosterUrl" placeholder="https://...">
                </div>

                <button type="submit">Guardar cambios</button>
            </form>
        </section>

    </main>

    <script src="../Scripts/backendService.js"></script>
    <script src="../Scripts/peliculas.js"></script>

</body>
</html>
